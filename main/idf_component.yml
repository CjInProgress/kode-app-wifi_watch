## One pin, and everything below the facade arrives at the same commit without
## being named: kaos, kqp, khal, kdrv, klog, kbsp and the vendored QP/C. Each
## component's own manifest declares its siblings with override_path, and the
## manager rewrites those into git dependencies on the SDK at the commit
## pinned here. Moving to a newer SDK is this one version line.
##
## The manager runs `git submodule update --init --recursive` over the whole
## SDK when it fetches any part, so the C5 firmware nested inside it arrives
## too. Both are public: no key is needed.
dependencies:
  kodediy/kode:
    git: https://github.com/kodediy/kode-sdk.git
    path: components/kode
    version: v0.1.1
  ## LVGL on the glass from this app's own Active Object, at the same version.
  ## It brings the UI kit, kui, and LVGL with it.
  kodediy/kscreen:
    git: https://github.com/kodediy/kode-sdk.git
    path: components/kscreen
    version: v0.1.1
